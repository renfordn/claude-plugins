name: Tests

# Root-level workflow for the whole monorepo. GitHub Actions only discovers workflows under
# <repo-root>/.github/workflows/ -- the per-plugin agent-isdd/.github/workflows/tests.yml and
# agent-tdd/.github/workflows/tests.yml files predate the 5-repo -> monorepo migration and have
# never once run in CI since, since a nested .github/workflows/ inside a subdirectory is not a
# location GitHub Actions looks at. This file replaces both; the nested ones are removed in the
# same change that adds this file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every plugin with test_*.py files, discovered recursively by pytest regardless of
        # whether the plugin's own tests live under tests/ (agent-isdd, agent-tdd) or hooks/ + scripts/ (agent-nelly).
        plugin: [agent-isdd, agent-tdd, agent-nelly, shared, code-reviewer, focus-ux, follow-through]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # No version was pinned anywhere in this repo before CI was fixed to actually run --
          # 3.11 is the assumed baseline documented in agent-isdd/tests/hook_test_utils.py.
          python-version: "3.11"

      - name: Configure a git identity for the runner
        # Several hooks (diff_fingerprint.py, commit_audit_gate.py, research_cache.py, and
        # others) test real `git` operations inside their own temp repos; a clean runner has no
        # git identity configured by default.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run ${{ matrix.plugin }} tests
        run: python -m pytest ${{ matrix.plugin }} -q

  smoke-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"

      - name: Install Python test dependencies
        run: pip install pytest

      - name: Smoke — Python plugins
        # One pytest invocation per plugin, not a single combined run: several plugins
        # ship their own private, same-named hooks/path_resolution.py (bare top-level
        # module, not a package). A single process's sys.modules cache is keyed by that
        # bare name, so whichever plugin's copy imports first wins for every plugin
        # collected afterward -- harmless while the copies are identical, but a hard
        # ImportError the moment two diverge (as two plugins' copies once did).
        # Matches python-tests' per-plugin matrix, which never combines processes either.
        run: |
          for plugin in agent-isdd agent-tdd agent-nelly shared code-reviewer; do
            python -m pytest "$plugin" -q --tb=short
          done

      - name: Smoke — plugin.json schemas valid
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path
          import re

          SEMVER = re.compile(r"^\d+\.\d+\.\d+$")
          REQUIRED = ["name", "version", "description", "author", "license"]
          plugins = [d for d in Path(".").iterdir()
                     if d.is_dir() and (d / ".claude-plugin" / "plugin.json").exists()]
          errors = []
          for p in plugins:
              pj = p / ".claude-plugin" / "plugin.json"
              try:
                  data = json.loads(pj.read_text())
              except Exception as e:
                  errors.append(f"{pj}: parse error: {e}")
                  continue
              for field in REQUIRED:
                  if field not in data:
                      errors.append(f"{pj}: missing field '{field}'")
              if "version" in data and not SEMVER.match(str(data["version"])):
                  errors.append(f"{pj}: version {data['version']!r} is not semver")
              if "name" in data and data["name"] != p.name:
                  errors.append(f"{pj}: name {data['name']!r} != dir {p.name!r}")
          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)
          print(f"plugin.json OK for {len(plugins)} plugins")
          EOF

  first-class-check:
    # Independent of python-tests: a first-class-check FAIL is a collection
    # consistency/onboarding/CI-hygiene gap, not a per-plugin test failure, and
    # shouldn't mask or be masked by that job. Stdlib-only, filesystem-only, no
    # matrix needed -- scripts/first_class_check.py iterates plugins itself by
    # reading .claude-plugin/marketplace.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run first-class checker
        run: python3 scripts/first_class_check.py
