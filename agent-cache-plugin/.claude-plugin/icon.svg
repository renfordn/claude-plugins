<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" fill="#f0f4f8" rx="24"/>

  <!-- Cache symbol: stacked database/storage -->
  <g transform="translate(24, 24)">
    <!-- Top database -->
    <rect x="4" y="0" width="72" height="24" fill="#3b82f6" rx="4"/>
    <ellipse cx="40" cy="24" rx="36" ry="8" fill="#2563eb"/>
    <rect x="4" y="24" width="72" height="16" fill="#3b82f6"/>

    <!-- Middle database (offset) -->
    <rect x="12" y="32" width="72" height="20" fill="#60a5fa" rx="3"/>
    <ellipse cx="48" cy="52" rx="36" ry="7" fill="#3b82f6"/>
    <rect x="12" y="52" width="72" height="14" fill="#60a5fa"/>

    <!-- Bottom database (offset) -->
    <rect x="20" y="62" width="72" height="20" fill="#93c5fd" rx="3"/>
    <ellipse cx="56" cy="82" rx="36" ry="7" fill="#60a5fa"/>
    <rect x="20" y="82" width="72" height="14" fill="#93c5fd"/>

    <!-- Checkmark overlay (cache hit indicator) -->
    <g transform="translate(68, 72)">
      <circle cx="0" cy="0" r="16" fill="#10b981"/>
      <path d="M -8 0 L -2 6 L 8 -4" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
