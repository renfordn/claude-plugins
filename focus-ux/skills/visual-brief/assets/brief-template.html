<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --ground: #F6F8FA; --surface: #FFFFFF; --ink: #1D2733; --muted: #5A6878; --line: #DCE3EA;
  --accent: #1F6F78; --accent-soft: #E3F1F2;
  --done: #2E7D4F; --done-soft: #E4F3EA; --current: #2F6FB0; --current-soft: #E3EEF9;
  --warn: #A86A12; --warn-soft: #FBF0DC; --high: #B3261E; --high-soft: #FBE6E4; --info: #5A6878;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #12181F; --surface: #1A222B; --ink: #E6EDF3; --muted: #9AA9B8; --line: #2C3844;
    --accent: #5FB8C1; --accent-soft: #173136;
    --done: #62C28A; --done-soft: #16301F; --current: #6FA8E6; --current-soft: #172A3F;
    --warn: #E0A24A; --warn-soft: #33260F; --high: #F07A70; --high-soft: #3A1A18; --info: #9AA9B8;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #12181F; --surface: #1A222B; --ink: #E6EDF3; --muted: #9AA9B8; --line: #2C3844;
  --accent: #5FB8C1; --accent-soft: #173136;
  --done: #62C28A; --done-soft: #16301F; --current: #6FA8E6; --current-soft: #172A3F;
  --warn: #E0A24A; --warn-soft: #33260F; --high: #F07A70; --high-soft: #3A1A18; --info: #9AA9B8;
}
body { background: var(--ground); color: var(--ink); font: 16px/1.55 var(--body); }
main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 28px; }
h1 { font-size: 1.6rem; line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
p { margin: 0; max-width: 65ch; }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
section { display: grid; gap: 10px; }
.scroll { overflow-x: auto; }

.progress { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.progress .label { width: 100%; font-weight: 700; color: var(--accent); font-size: 0.9rem; }
.phase { flex: 1 1 140px; border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); font-size: 0.9rem; }
.phase .name { font-weight: 700; }
.phase .note { color: var(--muted); font-size: 0.85rem; }
.phase.done { border-top-color: var(--done); }
.phase.current { border-top-color: var(--current); background: var(--current-soft); }
.phase.blocked { border-top-color: var(--high); }
.here { font-size: 0.75rem; font-weight: 700; color: var(--current); text-transform: uppercase; letter-spacing: 0.06em; }

.points { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.points li { display: grid; grid-template-columns: 1.6em 1fr; gap: 6px; }
.callout { color: var(--accent); font-weight: 700; }

.finding { display: grid; grid-template-columns: 5.2em 1fr; gap: 4px 12px; padding: 10px 12px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.sev { font: 600 0.72rem var(--mono); text-transform: uppercase; padding: 3px 6px; border-radius: 4px; text-align: center; align-self: start; }
.sev.high { background: var(--high-soft); color: var(--high); }
.sev.med { background: var(--warn-soft); color: var(--warn); }
.sev.low, .sev.info { background: var(--accent-soft); color: var(--info); }
.finding .title { font-weight: 700; }
.finding .detail, .finding .where { grid-column: 2; color: var(--muted); font-size: 0.92rem; }

.timeline { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); display: grid; gap: 12px; }
.timeline li { position: relative; }
.timeline li::before { content: ""; position: absolute; left: -25px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); }
.timeline li.done::before { background: var(--done); border-color: var(--done); }
.timeline li.current::before { background: var(--current); border-color: var(--current); box-shadow: 0 0 0 4px var(--current-soft); }
.timeline li.blocked::before { background: var(--high); border-color: var(--high); }
.timeline .when { font: 0.8rem var(--mono); color: var(--muted); }
.timeline .note { color: var(--muted); font-size: 0.92rem; }

table { border-collapse: collapse; width: 100%; background: var(--surface); font-size: 0.92rem; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
tr.pick th[scope="row"] { color: var(--accent); }
.v { font-weight: 700; margin-right: 4px; }
.v.yes { color: var(--done); } .v.no { color: var(--high); } .v.warn { color: var(--warn); } .v.na { color: var(--muted); }

.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(6em, 11em) 1fr auto; gap: 10px; align-items: center; font-size: 0.9rem; }
.track { height: 12px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; background: var(--muted); }
.bar.hl .fill { background: var(--accent); }
.bar .val { font: 0.85rem var(--mono); font-variant-numeric: tabular-nums; }

pre.mermaid { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin: 0; }
.caption { color: var(--muted); font-size: 0.88rem; }
ul.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 700; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details > .inner { display: grid; gap: 10px; padding-top: 10px; }

.next { border: 2px solid var(--accent); border-radius: 8px; padding: 14px 16px; background: var(--surface); display: grid; gap: 8px; }
.next h2 { color: var(--accent); margin: 0; }
@media (max-width: 480px) { .finding { grid-template-columns: 1fr; } .finding .detail, .finding .where { grid-column: 1; } .bar { grid-template-columns: 1fr auto; } .bar .track { grid-column: 1 / -1; grid-row: 2; } }
</style>
<main>
{{BODY}}
</main>
{{SCRIPTS}}
